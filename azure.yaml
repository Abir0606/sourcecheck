# Azure Developer CLI (azd) configuration.
#
# `azd provision` deploys the Bicep in ./infra and writes outputs to
# .azure/<env>/.env. Application images are built and rolled out by the
# GitHub Actions workflow (.github/workflows/deploy.yml).
#
#   azd auth login
#   azd env new sourcecheck-dev
#   azd env set AZURE_LOCATION westeurope
#   azd provision
#
name: sourcecheck
metadata:
  template: sourcecheck@0.1.0
infra:
  provider: bicep
  path: infra
  module: main
